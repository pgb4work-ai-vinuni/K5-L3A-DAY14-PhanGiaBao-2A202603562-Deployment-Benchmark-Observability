# Railway - deploy using the Dockerfile in this folder
# Env vars (AGENT_API_KEY, REDIS_URL...) are set on the dashboard or via `railway variables`,
# never here. Railway injects PORT; the Dockerfile CMD listens on ${PORT:-8000}.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
