# Render Blueprint — agent (Docker) + Redis-compatible Key Value
# Secret AGENT_API_KEY dùng `sync: false` → điền trên dashboard, không ghi giá trị ở đây.
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []
